[package]
name = "aleph-link"
version = "0.1.0"
edition = "2021"
description = "Signed message protocol between the Aleph Edge desktop and the phone"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
subtle = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23"

[dev-dependencies]
