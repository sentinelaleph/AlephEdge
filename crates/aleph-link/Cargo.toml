[package]
name = "aleph-link"
version = "0.1.0"
edition = "2021"
description = "Aleph Edge masaüstü ile telefon arasındaki imzalı mesaj protokolü"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

[dev-dependencies]
