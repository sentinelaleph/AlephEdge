[package]
name = "aleph-edge"
version = "0.3.20"
description = "Aleph Edge — Sentinel Aleph automated trading bot"
authors = ["Sentinel Aleph"]
edition = "2021"
rust-version = "1.90"

# The library the desktop binary (src/main.rs) is a thin wrapper around.
[lib]
name = "aleph_edge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aleph-link = { path = "../crates/aleph-link" }
aleph-desk-link = { path = "../crates/aleph-desk-link" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Signature-verified auto-update. Desktop-only.
# Without the default `zip` feature: the feed serves the NSIS setup.exe
# itself (createUpdaterArtifacts: true), never a .zip, so the plugin's zip
# extraction is dead code here. Dropping it removes the `zip` crate
# (RUSTSEC-2026-0367/0368/0369 in zip 4.x, still required by updater 2.14).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
# One desk per app identifier: a second launch focuses the running window
# instead of starting a second engine on the same edge.db. Held below 2.5,
# which needs rustc 1.90; the release toolchain is 1.88.
tauri-plugin-single-instance = "~2.4.1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: strategy cycle state is persisted as JSON and must come
# back bit-identical, or a restart would move order prices by an ulp.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Vault crypto — key material never leaves the device.
argon2 = "0.6"
aes-gcm = "0.11"
rand = "0.8"
zeroize = "1"
base64 = "0.22"

# OS-native secure storage: the vault's salt (device-binding) and the
# Sentinel membership refresh token + the vault salt. A platform-native store
# feature is REQUIRED: keyring 3 with no feature falls back to a non-persistent
# in-memory mock, so the salt (and refresh token) vanish on every restart and
# the vault password stops unlocking. windows-native = Credential Manager,
# apple-native = macOS Keychain.
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# HMAC-SHA256 request signing for authenticated Binance calls (e.g. verifying
# a newly-added key's real withdraw permission).
hmac = "0.13"
sha2 = "0.11"
# Constant-time compare of the TradingView passphrase hash. Already in the
# tree (through ed25519-dalek, digest and others), same version, so no new
# crate.
subtle = "2.6"
# Ed25519 for Binance "Self-generated" API keys: the app makes the keypair and
# signs with the private half. Already in the tree through ccxt-base (same
# version, same default features), so no new crate.
ed25519-dalek = "2.2"

# Sentinel membership client (ribqa.com auth + billing status) and the
# Sentinel signal stream (SSE over a streamed HTTP body).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Order layer for exchanges other than Binance (Binance keeps its own, testnet-verified layer).
ccxt = { version = "=4.5.85", default-features = false, features = ["bybit", "okx"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }

# Local trade history + metrics cache (SQLite; never holds keys).
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1.20.0", features = ["v4"] }

# flock() for the instance lock (app/instance.rs); Windows uses std's share mode.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Serves the bundled frontend (`build.frontendDist` in tauri.conf.json) instead
# of the dev server at `build.devUrl`; the Tauri CLI enables it for release builds.
custom-protocol = ["tauri/custom-protocol"]
# ONE build since 0.3.19: the real-money order path (`LIVE_TRADING_ENABLED`)
# is always compiled into the desktop app, and the user chooses Paper or Live
# per bot. Building without it is a compile error (src/lib.rs). Real orders
# still need a Live bot (chosen with a typed confirmation of the money at
# risk), a per-session typed LIVE arm, a verified trade-only key in the
# unlocked vault and a venue whose order path passed its test-network run.
# The headless bot farm mounts bot/model.rs without this feature: never live.
default = ["live"]
live = []
