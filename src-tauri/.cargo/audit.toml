# cargo audit (run from src-tauri/). Unmaintained, unsound and yanked crates
# are reported as warnings; a vulnerability fails the run unless listed here.
[advisories]
ignore = [
  # rsa: Marvin timing side channel, no fixed release. Pulled in by ccxt-base
  # whatever venues are enabled. Of the 7 ccxt venues only Bybit's code signs
  # with RSA, and only when the secret is an RSA private key; Aleph Edge
  # refuses such secrets on every venue (exchange::venue::ccxt::is_rsa_secret),
  # so requests are signed with HMAC.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5.5: timing variability. It comes in through k256 0.13
  # (elliptic-curve 0.13), which ccxt-base 4.5.85 requires whatever venues
  # are enabled, so dropping a feature cannot remove it. No enabled venue
  # signs with secp256k1: the 7 ccxt venues (Bybit, OKX, Bitget, Gate, BingX,
  # WOO X, Deribit) sign every request with HMAC (SHA-512 on Gate, SHA-256
  # elsewhere) in ccxt-base's `sign` (checked in the 4.5.85 source, 1 Nov
  # 2026; Bybit's RSA branch is covered above), and Binance uses its own layer (HMAC or Ed25519,
  # exchange/providers/binance_sign.rs). Hyperliquid, whose orders sign with
  # k256, was removed as an order venue in 0.3.22 for this reason and is
  # price data / paper only (public info endpoint, nothing signed).
  # Revisit when a k256 release on crypto-bigint >= 0.7.6 exists.
  "RUSTSEC-2026-0387",
]
